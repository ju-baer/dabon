[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "dabon"
version         = "0.1.0"
description     = "Disagreement-Aware Best-of-N: Reward-Space Exploration for LLM Search"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "MIT" }
keywords        = [
  "large language models", "reward models", "best-of-n sampling",
  "diversity", "inference-time scaling", "reinforcement learning from human feedback"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.27.0",
  "sentence-transformers>=2.6.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "scikit-learn>=1.4.0",
  "pandas>=2.2.0",
  "nltk>=3.8.1",
  "datasets>=2.19.0",
  "matplotlib>=3.8.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
vllm    = ["vllm>=0.4.0"]
judge   = ["openai>=1.20.0"]
track   = ["wandb>=0.16.0"]
dev     = [
  "pytest>=8.0.0", "pytest-cov>=5.0.0",
  "black>=24.0.0", "isort>=5.13.0",
  "flake8>=7.0.0", "mypy>=1.9.0",
  "jupyter>=1.0.0", "ipykernel",
]
all     = ["dabon[vllm,judge,track,dev]"]

[project.urls]
"Homepage"    = "https://github.com/your-username/dabon"
"Bug Tracker" = "https://github.com/your-username/dabon/issues"
"Paper"       = "https://arxiv.org/abs/XXXX.XXXXX"

[project.scripts]
dabon-smoke = "scripts.smoke_test:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length    = 88
target-version = ["py310", "py311"]
skip-string-normalization = true

[tool.isort]
profile         = "black"
line_length     = 88
known_first_party = ["src"]

[tool.mypy]
python_version  = "3.10"
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
